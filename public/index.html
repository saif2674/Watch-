<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchHub - Premium Watches</title>
  <meta property="og:title" content="WatchHub - Premium Watches">
  <meta property="og:description" content="Discover our handpicked collection of premium watches, crafted for every style and occasion.">
  <meta property="og:image" content="https://i.ibb.co/Xrx2FNjm/file-000000008df88208bf3cf89f52b6dfcd.png">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="https://i.ibb.co/FT8KrZq/file-00000000039c82088e38b3467c1dfeb3.png" alt="WatchHub" class="site-logo" onclick="location.href='index.html'">
    <button id="cart-btn" onclick="toggleCart()">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="welcome-note">
    <h2>Welcome to WatchHub</h2>
    <p>Discover our handpicked collection of premium watches, crafted for every style and occasion.</p>
  </section>

  <section class="hero">
    <h2>Elevate Every Moment</h2>
    <p>Handpicked timepieces for every occasion</p>
  </section>

  <section class="filters">
    <input type="text" id="search-box" placeholder="Search watches...">
    <div class="filter-buttons" id="filter-buttons">
      <button class="filter-btn active" data-category="All">All</button>
    </div>
  </section>

  <main class="products" id="products"></main>

  <footer>
    <p>&copy; 2026 WatchHub. All rights reserved.</p>
    <p>Crafted with precision, delivered with care.</p>
  </footer>

  <div id="cart-panel" class="cart-panel">
    <h2>🛒 Your Cart</h2>
    <div id="cart-items"></div>
    <p class="cart-total-row">Total: Rs <span id="cart-total">0</span></p>
    <button onclick="location.href='checkout.html'" class="checkout-btn">Proceed to Checkout</button>
    <button onclick="toggleCart()">Close</button>
  </div>

  
  <script type="module" src="js/app.js"></script>
</body>
</html>
