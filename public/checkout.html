<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - WatchHub</title>
  <meta property="og:title" content="Checkout - WatchHub">
  <meta property="og:description" content="Complete your order at WatchHub - Timeless Style, Delivered.">
  <meta property="og:image" content="https://i.ibb.co/Xrx2FNjm/file-000000008df88208bf3cf89f52b6dfcd.png">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="https://i.ibb.co/FT8KrZq/file-00000000039c82088e38b3467c1dfeb3.png" alt="WatchHub" class="site-logo" onclick="location.href='index.html'">
  </header>

  <main class="checkout-page">
    <h2>Checkout</h2>
    <div id="checkout-items"></div>
    <p class="cart-total-row">Total: Rs <span id="checkout-total">0</span></p>

    <div class="delivery-note">
      ⚠️ Delivery charges must be paid in advance. The remaining amount is payable after delivery.
    </div>

    <div class="checkout-form">
      <input type="text" id="cust-name" placeholder="Your Name">
      <input type="tel" id="cust-phone" placeholder="Your Phone Number">
      <textarea id="cust-address" placeholder="Delivery Address" rows="3"></textarea>
      <button id="whatsapp-order-btn">Order via WhatsApp</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 WatchHub. All rights reserved.</p>
    <p>Crafted with precision, delivered with care.</p>
  </footer>

  <script src="js/checkout.js"></script>
</body>
</html>
