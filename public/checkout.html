<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - WatchHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 onclick="location.href='index.html'" style="cursor:pointer">WATCHHUB</h1>
    <p>Timeless Style, Delivered</p>
  </header>

  <main class="checkout-page">
    <h2>Checkout</h2>
    <div id="checkout-items"></div>
    <p class="cart-total-row">Total: Rs <span id="checkout-total">0</span></p>

    <div class="delivery-note">
      ⚠️ Delivery charges must be paid in advance. The remaining amount is payable after delivery.
    </div>

    <div class="checkout-form">
      <input type="text" id="cust-name" placeholder="Your Name">
      <input type="tel" id="cust-phone" placeholder="Your Phone Number">
      <textarea id="cust-address" placeholder="Delivery Address" rows="3"></textarea>
      <button id="whatsapp-order-btn">Order via WhatsApp</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 WatchHub. All rights reserved.</p>
    <p>Crafted with precision, delivered with care.</p>
  </footer>

  <script src="js/checkout.js"></script>
</body>
</html>
