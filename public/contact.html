<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - WatchHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>if(localStorage.getItem("theme")==="dark"){document.documentElement.classList.add("dark-mode");}</script>
</head>
<body>
  <header>
    <img src="https://i.ibb.co/FT8KrZq/file-00000000039c82088e38b3467c1dfeb3.png" alt="WatchHub" class="site-logo" onclick="location.href='index.html'">
  </header>
  <a href="index.html" class="back-to-shop-link">&larr; Back to Home</a>

  <main class="contact-page">
    <h2>Contact WatchHub</h2>
    <p class="contact-subtitle">We'd love to hear from you. Reach out anytime.</p>

    <div class="contact-info-grid">
      <a href="tel:+923370596139" class="contact-info-card">
        <span class="ci-icon-circle">&#128222;</span>
        <span class="ci-label">Call Us</span>
      </a>
      <a href="mailto:aiden457377@gmail.com" class="contact-info-card">
        <span class="ci-icon-circle">&#128231;</span>
        <span class="ci-label">Email Us</span>
      </a>
      <a href="https://wa.me/923370596139" target="_blank" class="contact-info-card">
        <span class="ci-icon-circle">&#128172;</span>
        <span class="ci-label">WhatsApp</span>
      </a>
    </div>

    <div class="contact-form">
      <h3>Send us a Message</h3>
      <input type="text" id="contact-name" placeholder="Your Name">
      <input type="email" id="contact-email" placeholder="Your Email">
      <textarea id="contact-message" placeholder="Your Message" rows="4"></textarea>
      <button id="contact-send-btn">Send via Email</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 WatchHub. All rights reserved.</p>
    <p>Crafted with precision, delivered with care.</p>
  </footer>

  <script>
    document.getElementById("contact-send-btn").addEventListener("click", () => {
      const name = document.getElementById("contact-name").value.trim();
      const email = document.getElementById("contact-email").value.trim();
      const message = document.getElementById("contact-message").value.trim();

      if (!name || !message) {
        alert("Please fill in your name and message.");
        return;
      }

      const subject = encodeURIComponent(`New message from ${name} - WatchHub Contact`);
      const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
      window.location.href = `mailto:aiden457377@gmail.com?subject=${subject}&body=${body}`;
    });
  </script>
  <script src="js/theme.js"></script>
</body>
</html>
