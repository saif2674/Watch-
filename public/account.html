<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - WatchHub</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 55%, #241f16 100%); min-height:100vh; margin:0; }
  .account-wrap { max-width: 380px; margin: 0 auto; padding: 60px 15px; min-height:100vh; box-sizing:border-box; display:flex; align-items:center; justify-content:center; }
  .account-box {
    width:100%;
    background:#1a1a1a;
    padding:30px 25px;
    border-radius:18px;
    border:1px solid rgba(212,175,86,0.25);
    opacity:0;
    animation: fadeSlideUp 0.7s ease forwards, boxGlow 3.2s ease-in-out infinite 0.7s;
  }
  @keyframes fadeSlideUp {
    from { opacity:0; transform:translateY(30px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes boxGlow {
    0%, 100% { box-shadow: 0 0 18px rgba(212,175,86,0.12); }
    50% { box-shadow: 0 0 32px rgba(212,175,86,0.3); }
  }
  .account-logo { max-width:130px; display:block; margin:0 auto 22px; filter: drop-shadow(0 0 8px rgba(212,175,86,0.5)); }
  .account-tabs { display:flex; margin-bottom:22px; background:#111; border-radius:10px; padding:4px; }
  .account-tab-btn { flex:1; padding:10px; border:none; background:transparent; font-weight:600; color:#999; border-radius:8px; transition:all 0.25s ease; }
  .account-tab-btn.active { background:linear-gradient(135deg,#d4af86,#b98f5e); color:#141414; }
  .account-form { display:none; }
  .account-form.active { display:block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .account-form input {
    width:100%; padding:12px; margin-bottom:12px; border:1px solid #333; border-radius:8px;
    box-sizing:border-box; background:#111; color:#eee; font-size:14px;
  }
  .account-form input::placeholder { color:#777; }
  .account-form input:focus { outline:none; border-color:#d4af86; }
  .account-form button.primary-btn {
    width:100%; padding:11px; border:none; border-radius:8px;
    background:linear-gradient(135deg,#d4af86,#b98f5e); color:#141414; font-weight:700; margin-bottom:12px;
    transition:transform 0.2s ease;
  }
  .account-form button.primary-btn:active { transform:scale(0.97); }
  .google-btn {
    width:100%; padding:11px; border:1px solid #444; border-radius:8px;
    background:#111; color:#eee; font-weight:600; transition:all 0.2s ease;
  }
  .google-btn:hover { border-color:#d4af86; }
  .divider { text-align:center; color:#666; font-size:13px; margin:14px 0; }
  #account-error { color:#e77; text-align:center; margin-top:12px; font-size:14px; }
</style>
</head>
<body>
  <div class="account-wrap">
    <a href="index.html" class="back-to-shop-link" style="margin-bottom:10px;">&larr; Back to Home</a>
    <div class="account-box">
      <img src="https://i.ibb.co/FT8KrZq/file-00000000039c82088e38b3467c1dfeb3.png" alt="WatchHub" class="account-logo">

      <div class="account-tabs">
        <button class="account-tab-btn active" id="tab-login-btn">Login</button>
        <button class="account-tab-btn" id="tab-signup-btn">Sign Up</button>
      </div>

      <div class="account-form active" id="form-login">
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button class="primary-btn" id="loginBtn">Login</button>
        <div class="divider">or</div>
        <button class="google-btn" id="googleLoginBtn">Continue with Google</button>
      </div>

      <div class="account-form" id="form-signup">
        <input type="text" id="signup-name" placeholder="Full Name">
        <input type="email" id="signup-email" placeholder="Email">
        <input type="password" id="signup-password" placeholder="Password (min 6 characters)">
        <button class="primary-btn" id="signupBtn">Sign Up</button>
        <div class="divider">or</div>
        <button class="google-btn" id="googleSignupBtn">Continue with Google</button>
      </div>

      <p id="account-error"></p>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import {
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

    const errorEl = document.getElementById("account-error");

    getRedirectResult(auth).catch((err) => {
      errorEl.textContent = "Google sign-in failed: " + err.message;
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    const tabLoginBtn = document.getElementById("tab-login-btn");
    const tabSignupBtn = document.getElementById("tab-signup-btn");
    const formLogin = document.getElementById("form-login");
    const formSignup = document.getElementById("form-signup");

    tabLoginBtn.addEventListener("click", () => {
      tabLoginBtn.classList.add("active");
      tabSignupBtn.classList.remove("active");
      formLogin.classList.add("active");
      formSignup.classList.remove("active");
      errorEl.textContent = "";
    });

    
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("tab") === "signup") {
      tabSignupBtn.click();
    }

    tabSignupBtn.addEventListener("click", () => {
      tabSignupBtn.classList.add("active");
      tabLoginBtn.classList.remove("active");
      formSignup.classList.add("active");
      formLogin.classList.remove("active");
      errorEl.textContent = "";
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      errorEl.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("login-email").value, document.getElementById("login-password").value);
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = "Login failed: " + err.message;
      }
    });

    document.getElementById("signupBtn").addEventListener("click", async () => {
      errorEl.textContent = "";
      const name = document.getElementById("signup-name").value;
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      if (!name || !email || !password) {
        errorEl.textContent = "Please fill all fields.";
        return;
      }
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = "Sign up failed: " + err.message;
      }
    });

    async function googleSignIn() {
      errorEl.textContent = "";
      const provider = new GoogleAuthProvider();
      await signInWithRedirect(auth, provider);
    }

    document.getElementById("googleLoginBtn").addEventListener("click", googleSignIn);
    document.getElementById("googleSignupBtn").addEventListener("click", googleSignIn);
  </script>
</body>
</html>
