<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - WatchHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { margin: 0; font-family: 'Poppins', sans-serif; min-height: 100vh;
    background: linear-gradient(160deg, #0d0d0d 0%, #1a1a1a 55%, #2a2113 100%);
    display: flex; align-items: center; justify-content: center; padding: 24px 16px 110px; }
  .login-box { width: 100%; max-width: 380px; background: #fff; padding: 34px 28px; border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5); animation: admUp 0.6s ease both; }
  @keyframes admUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  .login-brand { text-align: center; font-family: 'Playfair Display', serif; font-size: 26px; color: #141414; }
  .login-sub { text-align: center; color: #b98d54; font-size: 11.5px; letter-spacing: 3px; margin: 4px 0 24px; font-weight: 600; }
  .login-box label { display: block; font-size: 12.5px; font-weight: 600; color: #555; margin: 0 0 6px 2px; }
  .login-box input { width: 100%; padding: 13px 15px; margin-bottom: 16px; border: 1.5px solid #e3dac6; border-radius: 12px; box-sizing: border-box; font-size: 14.5px; font-family: 'Poppins', sans-serif; }
  .login-box input:focus { outline: none; border-color: #d4af86; box-shadow: 0 0 0 4px rgba(212,175,134,0.18); }
  .login-box button { width: 100%; padding: 13px; border-radius: 12px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #e8cf9f, #b98d54); color: #191204; font-weight: 700; font-size: 15px; font-family: 'Poppins', sans-serif; }
  .login-box button:active { transform: scale(0.98); }
  #error-msg { color: #d33; text-align: center; margin-top: 12px; font-size: 13px; }
  #ok-msg { color: #1c7c43; text-align: center; margin-top: 12px; font-size: 13px; }
  .login-links { text-align: center; margin-top: 16px; font-size: 13px; }
  .login-links a { color: #8a6a34; text-decoration: none; cursor: pointer; }
  .login-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="login-box">
    <div class="login-brand">⌚ WatchHub</div>
    <p class="login-sub">ADMIN PANEL</p>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Admin email">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="error-msg"></p>
    <p id="ok-msg"></p>
    <div class="login-links">
      <a id="forgot-link">Forgot password?</a> &middot; <a href="index.html">Back to store</a>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

    const errorMsg = document.getElementById("error-msg");
    const okMsg = document.getElementById("ok-msg");

    async function doLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      errorMsg.textContent = "";
      okMsg.textContent = "";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "admin-dashboard.html";
      } catch (err) {
        errorMsg.textContent = "Login failed: " + err.message;
      }
    }

    document.getElementById("loginBtn").addEventListener("click", doLogin);
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });

    document.getElementById("forgot-link").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      errorMsg.textContent = "";
      okMsg.textContent = "";
      if (!email) {
        errorMsg.textContent = "Pehle apna admin email likhein, phir Forgot password par click karein.";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        okMsg.textContent = "Password reset email bhej di gayi hai — apna inbox check karein.";
      } catch (err) {
        errorMsg.textContent = "Reset failed: " + err.message;
      }
    });
  </script>
</body>
</html>
