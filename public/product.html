<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - WatchHub</title>
  <meta property="og:title" content="Product Details - WatchHub">
  <meta property="og:description" content="Handpicked timepieces for every occasion.">
  <meta property="og:image" content="https://i.ibb.co/Xrx2FNjm/file-000000008df88208bf3cf89f52b6dfcd.png">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-left">
      <button id="login-btn" class="account-btn login-variant shine-btn" onclick="location.href='account.html?tab=login'">Login</button>
      <button id="signup-btn" class="account-btn signup-variant shine-btn" onclick="location.href='account.html?tab=signup'">Signup</button>
      <button id="account-btn" class="account-btn" style="display:none;"></button>
    </div>
    <button id="logout-icon-btn" class="logout-icon-btn" style="display:none;" title="Logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
    </button>
  </div>
  <header>
    <img src="https://i.ibb.co/FT8KrZq/file-00000000039c82088e38b3467c1dfeb3.png" alt="WatchHub" class="site-logo" onclick="location.href='index.html'">
        <button id="favorite-btn" class="favorite-btn" style="display:none;">
      <span class="heart-icon">❤</span> Favorite
    </button>
    <button id="cart-btn" onclick="toggleCart()">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>
  <a href="index.html" class="back-to-shop-link">&larr; Back to Home</a>

  <main id="product-detail" class="product-detail"></main>

  <footer>
    <p>&copy; 2026 WatchHub. All rights reserved.</p>
    <p>Crafted with precision, delivered with care.</p>
    <p><a href="contact.html" class="footer-link">Contact Us</a></p>
  </footer>

  <div id="cart-panel" class="cart-panel">
    <h2>🛒 Your Cart</h2>
    <div id="cart-items"></div>
    <p class="cart-total-row">Total: Rs <span id="cart-total">0</span></p>
    <button onclick="location.href='checkout.html'" class="checkout-btn">Proceed to Checkout</button>
    <button onclick="toggleCart()">Close</button>
  </div>

  
  <script type="module" src="js/product.js"></script>
  <script type="module" src="js/header-auth.js"></script>
</body>
</html>
