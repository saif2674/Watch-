<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - WatchHub</title>
  <meta property="og:title" content="Product Details - WatchHub">
  <meta property="og:description" content="Handpicked timepieces for every occasion.">
  <meta property="og:image" content="https://i.ibb.co/Xrx2FNjm/file-000000008df88208bf3cf89f52b6dfcd.png">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="https://i.ibb.co/FT8KrZq/file-00000000039c82088e38b3467c1dfeb3.png" alt="WatchHub" class="site-logo" onclick="location.href='index.html'">
    <button id="cart-btn" onclick="toggleCart()">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <main id="product-detail" class="product-detail"></main>

  <footer>
    <p>&copy; 2026 WatchHub. All rights reserved.</p>
    <p>Crafted with precision, delivered with care.</p>
  </footer>

  <div id="cart-panel" class="cart-panel">
    <h2>🛒 Your Cart</h2>
    <div id="cart-items"></div>
    <p class="cart-total-row">Total: Rs <span id="cart-total">0</span></p>
    <button onclick="location.href='checkout.html'" class="checkout-btn">Proceed to Checkout</button>
    <button onclick="toggleCart()">Close</button>
  </div>

  
  <script type="module" src="js/product.js"></script>
</body>
</html>
