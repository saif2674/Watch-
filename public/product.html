<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - WatchHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 onclick="location.href='index.html'" style="cursor:pointer">WATCHHUB</h1>
    <p>Timeless Style, Delivered</p>
    <button id="cart-btn" onclick="toggleCart()">
      🛒 Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <main id="product-detail" class="product-detail"></main>

  <div id="cart-panel" class="cart-panel">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <p class="cart-total-row">Total: ₹<span id="cart-total">0</span></p>
    <button onclick="toggleCart()">Close</button>
  </div>

  <script src="js/products.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
