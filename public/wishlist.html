<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist - WatchHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="page-loader">
  <div class="watch-loader-main">
    <div class="wl-face">
      <div class="wl-hand wl-hour"></div>
      <div class="wl-hand wl-minute"></div>
      <div class="wl-center"></div>
    </div>
    <p class="wl-text">WatchHub</p>
  </div>
</div>

<header class="wishlist-header">
  <a href="index.html" style="text-decoration:none;color:inherit;"><h2>WatchHub</h2></a>
  <a href="index.html" class="back-to-shop-link">← Back to Shop</a>
</header>

<main class="wishlist-main">
  <div class="wishlist-title-row">
    <h1 class="wishlist-title">My Wishlist</h1>
    <p class="wishlist-subtitle">Your handpicked favorites, saved for later</p>
  </div>
  <div id="wishlist-container" class="products"></div>
</main>

<script type="module" src="js/wishlist.js"></script>
</body>
</html>
